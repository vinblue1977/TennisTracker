[project]
name = "tennis-tracker"
version = "0.1.0"
description = "iPhone-first tennis tracker on serverless AWS: WTN history, matches, stats and reminders"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=infra --cov-report=term-missing:skip-covered"

[tool.ruff]
line-length = 130
target-version = "py314"
extend-exclude = ["build", ".venv", "cdk.out", "node_modules"]

[tool.ruff.lint]
# E/F/W: correctness, I: imports, B: bugbear, UP: modern syntax, S: bandit security checks
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
