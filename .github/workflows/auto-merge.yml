name: Auto-merge

# Turns on squash auto-merge for every PR from this repo (mine and Dependabot's), so a PR merges the moment the
# required checks pass and nobody has to remember. pull_request_target gives Dependabot a write token; the job
# never checks out or runs PR code, only calls the GitHub API, which keeps that safe.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  enable:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: write
      contents: write  # enablePullRequestAutoMerge needs it
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
